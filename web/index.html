<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BiyaheMeter PH — Know your fare. Plan your byahe.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BiyaheMeter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>BiyaheMeter PH</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" as="image" href="logo_dark_hd.png">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <style id="splash-screen-style">
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #071126 0%, #0A1838 50%, #060D1F 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    /* Cursor/Electron and some embeds leave Flutter hosts at 0x0 — paint works but taps miss. */
    flt-glass-pane,
    flt-scene-host,
    flt-scene,
    flt-canvas-container {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      pointer-events: auto !important;
    }
    flutter-view {
      position: absolute !important;
      inset: 0 !important;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #071126 0%, #0A1838 50%, #060D1F 100%);
      z-index: 9999;
      transition: opacity 350ms cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      -webkit-user-select: none;
    }
    .logo-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Ambient luminous meter aura */
    .logo-aura {
      position: absolute;
      width: 380px;
      height: 220px;
      background: radial-gradient(ellipse at center, rgba(56, 189, 248, 0.28) 0%, rgba(37, 99, 235, 0.12) 50%, transparent 75%);
      filter: blur(28px);
      border-radius: 50%;
      animation: auraBreath 3s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes auraBreath {
      0% { transform: scale(0.92); opacity: 0.6; }
      100% { transform: scale(1.08); opacity: 1.0; }
    }
    .splash-logo {
      position: relative;
      width: clamp(240px, 72vw, 360px);
      height: auto;
      object-fit: contain;
      display: block;
      animation: logoReveal 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
      filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.35));
    }
    @keyframes logoReveal {
      0% {
        opacity: 0;
        transform: scale(0.86);
      }
      100% {
        opacity: 1;
        transform: scale(1.0);
      }
    }
    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      const splash = document.getElementById("splash");
      if (!splash) return;
      splash.classList.add("fade-out");
      setTimeout(() => {
        splash.remove();
      }, 350);
    }
    window.addEventListener("flutter-first-frame", removeSplashFromWeb);
    // Fallback safety timeout
    setTimeout(removeSplashFromWeb, 6000);
  </script>
</head>
<body>
  <div id="splash">
    <div class="logo-container">
      <div class="logo-aura"></div>
      <img class="splash-logo" src="logo_dark_hd.png" alt="BiyaheMeter">
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
