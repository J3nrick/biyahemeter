<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BiyaheMeter PH — Know your fare. Plan your byahe.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BiyaheMeter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>BiyaheMeter PH</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" as="image" href="logo.png">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <style id="splash-screen-style">
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #071126 0%, #0A1838 55%, #060D1F 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    /* Cursor/Electron and some embeds leave Flutter hosts at 0x0 — paint works but taps miss. */
    flt-glass-pane,
    flt-scene-host,
    flt-scene,
    flt-canvas-container {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      pointer-events: auto !important;
    }
    flutter-view {
      position: absolute !important;
      inset: 0 !important;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #071126 0%, #0A1838 55%, #060D1F 100%);
      z-index: 9999;
      transition: opacity 300ms ease;
      user-select: none;
      -webkit-user-select: none;
    }
    .splash-logo {
      width: 96px;
      height: 96px;
      object-fit: contain;
      display: block;
      margin-bottom: 24px;
    }
    .splash-title {
      color: #FFFFFF;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0 0 8px 0;
      text-align: center;
    }
    .splash-tagline {
      color: #94A3B8;
      font-size: 14px;
      letter-spacing: 0.2px;
      margin: 0;
      text-align: center;
      font-weight: 400;
    }
    .splash-spinner {
      width: 24px;
      height: 24px;
      border: 2.2px solid rgba(255, 255, 255, 0.2);
      border-top-color: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .splash-version {
      color: rgba(255, 255, 255, 0.24);
      font-size: 11px;
      letter-spacing: 1.0px;
      font-weight: 500;
      margin-top: 16px;
      margin-bottom: 24px;
    }
    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      const splash = document.getElementById("splash");
      if (!splash) return;
      splash.classList.add("fade-out");
      setTimeout(() => {
        splash.remove();
      }, 300);
    }
    window.addEventListener("flutter-first-frame", removeSplashFromWeb);
    // Fallback safety timeout
    setTimeout(removeSplashFromWeb, 7000);
  </script>
</head>
<body>
  <div id="splash">
    <div style="flex: 6;"></div>
    <img class="splash-logo" src="logo.png" alt="BiyaheMeter">
    <h1 class="splash-title">BiyaheMeter</h1>
    <p class="splash-tagline">Know your fare. Plan your byahe.</p>
    <div style="flex: 7;"></div>
    <div class="splash-spinner"></div>
    <div class="splash-version">v1.0</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
