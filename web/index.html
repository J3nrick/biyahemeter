<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BiyaheMeter PH — premium taxi meter for Filipino drivers">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BiyaheMeter PH">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>BiyaheMeter PH</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" as="image" href="assets/assets/images/logo.png">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <style id="splash-screen-style">
    html { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      background-color: #F5F6F8;
    }
    /* Cursor/Electron and some embeds leave Flutter hosts at 0x0 — paint works but taps miss. */
    flt-glass-pane,
    flt-scene-host,
    flt-scene,
    flt-canvas-container {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      pointer-events: auto !important;
    }
    flutter-view {
      position: absolute !important;
      inset: 0 !important;
    }
    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #F5F6F8;
      z-index: 9999;
      transition: opacity 280ms ease;
    }
    /* Same formula as BrandLogo.splashCanvasWidth so Flutter's first frame lines up. */
    #splash img {
      width: clamp(260px, 72vmin, 400px);
      height: auto;
    }
    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb(fromFlutter) {
      const splash = document.getElementById("splash");
      if (!splash) return;
      // Only clear the HTML overlay once Flutter has painted, or after a longer
      // safety timeout. Keep the light body color so the page never goes black.
      splash.classList.add("fade-out");
      setTimeout(() => {
        splash.remove();
        document.getElementById("splash-branding")?.remove();
        if (fromFlutter) {
          document.body.style.background = "transparent";
        } else {
          document.body.style.backgroundColor = "#F5F6F8";
        }
      }, 280);
    }
    window.addEventListener("flutter-first-frame", () => removeSplashFromWeb(true));
    // Safety: unblock if Flutter never signals (broken attach / old cache).
    setTimeout(() => removeSplashFromWeb(false), 8000);
  </script>
</head>
<body>
  <picture id="splash">
    <img class="center" aria-hidden="true" src="assets/assets/images/logo.png" alt="">
  </picture>

  <!-- Required by maplibre_gl on web. Deferred so it never delays app start; safe
       because the map only mounts after the splash and the agreements tap. -->
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
