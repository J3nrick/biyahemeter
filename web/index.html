<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Biyahe Meter — fare estimator for Philippine rides. Know your fare. Plan your byahe.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BiyaheMeter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>BiyaheMeter PH</title>
  <link rel="manifest" href="manifest.json">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <style id="splash-screen-style">
    * {
      box-sizing: border-box;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    *::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 48%, #0A142D 0%, #060B1A 55%, #03050B 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    flt-glass-pane,
    flt-scene-host,
    flt-scene,
    flt-canvas-container {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      pointer-events: auto !important;
    }
    flutter-view {
      position: absolute !important;
      inset: 0 !important;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 48%, #0A142D 0%, #060B1A 55%, #03050B 100%);
      z-index: 9999;
      transition: opacity 400ms cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      -webkit-user-select: none;
    }
    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      const splash = document.getElementById("splash");
      if (!splash) return;
      splash.classList.add("fade-out");
      setTimeout(() => {
        splash.remove();
      }, 400);
    }
    window.addEventListener("flutter-first-frame", removeSplashFromWeb);
    setTimeout(removeSplashFromWeb, 6000);
  </script>
</head>
<body>
  <!-- Plain backdrop only: the animated Flutter splash is the brand moment. -->
  <div id="splash"></div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
