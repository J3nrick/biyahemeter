<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BiyaheMeter PH — Know your fare. Plan your byahe.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BiyaheMeter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>BiyaheMeter PH</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" as="image" href="logo_dark_hd.png">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <style id="splash-screen-style">
    * {
      box-sizing: border-box;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    *::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 48%, #0A142D 0%, #060B1A 55%, #03050B 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    flt-glass-pane,
    flt-scene-host,
    flt-scene,
    flt-canvas-container {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      pointer-events: auto !important;
    }
    flutter-view {
      position: absolute !important;
      inset: 0 !important;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 48%, #0A142D 0%, #060B1A 55%, #03050B 100%);
      z-index: 9999;
      transition: opacity 400ms cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      -webkit-user-select: none;
    }
    .logo-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Ethereal breathing aura */
    .logo-aura {
      position: absolute;
      width: 440px;
      height: 260px;
      background: radial-gradient(ellipse at center, rgba(56, 189, 248, 0.22) 0%, rgba(29, 78, 216, 0.10) 50%, transparent 75%);
      filter: blur(36px);
      border-radius: 50%;
      animation: auraPulse 3.2s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes auraPulse {
      0% { transform: scale(0.92); opacity: 0.55; }
      100% { transform: scale(1.08); opacity: 0.95; }
    }
    .splash-logo {
      position: relative;
      width: clamp(250px, 70vw, 350px);
      height: auto;
      object-fit: contain;
      display: block;
      animation: logoEntrance 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.45));
    }
    @keyframes logoEntrance {
      0% {
        opacity: 0;
        transform: scale(0.94);
      }
      100% {
        opacity: 1;
        transform: scale(1.0);
      }
    }
    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      const splash = document.getElementById("splash");
      if (!splash) return;
      splash.classList.add("fade-out");
      setTimeout(() => {
        splash.remove();
      }, 400);
    }
    window.addEventListener("flutter-first-frame", removeSplashFromWeb);
    setTimeout(removeSplashFromWeb, 6000);
  </script>
</head>
<body>
  <div id="splash">
    <div class="logo-stage">
      <div class="logo-aura"></div>
      <img class="splash-logo" src="logo_dark_hd.png" alt="BiyaheMeter">
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
